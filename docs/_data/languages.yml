# BEAM languages, rendered by languages/index.md.
# site_stale: true means the project site no longer exists; no outbound link is rendered.
- name: Bragful
  link: https://github.com/bragful/ephp
  image: "/assets/images/languages/ephp.svg"
  about: Bragful provides PHP over Erlang, interpreted and written in 100% Erlang. Bragful can easily be integrated into web site projects as a PHP extension language for your server, embedded system(s), or Erlang and Elixir applications.
- name: Caramel
  link: https://caramel.abstractmachines.dev/
  image: "/assets/images/languages/caramel.svg"
  about: Caramel is an experimental project, featuring primarily an Erlang backend to the OCaml compiler, that brings one of the most mature and expressive type-systems in the world to the BEAM.
  site_stale: true
- name: Clojerl
  link: https://clojerl.org/
  image: "/assets/images/languages/clojerl.svg"
  about: Clojerl is a (feature complete) experimental implementation of Clojure on the BEAM. Its design goals are to be very close to Clojure while providing frictionless interoperability with the BEAM.
- name: Cuneiform
  link: https://cuneiform-lang.org/
  image:
  about: Cuneiform is functional programming language for large-scale data analysis which easily integrates with foreign tools and libraries and scales to large clusters and clouds.
- name: Elchemy
  link: https://wende.github.io/elchemy/
  image: "/assets/images/languages/elchemy.svg"
  about: Elchemy lets you write simple, fast and quality type safe code while leveraging both the Elm’s safety and Elixir’s ecosystem. It puts an emphasis on both Elm and Elixir compatibility and human-readable output of the generated Elixir code
- name: Elixir
  link: https://elixir-lang.org/
  image: "/assets/images/languages/elixir.svg"
  about: Elixir is a dynamic, functional language designed for building scalable and maintainable applications on top of the Erlang VM. Elixir is successfully used for web development, embedded software, data ingestion, and multimedia processing.
- name: Erlang
  link: https://www.erlang.org/
  image: "/assets/images/languages/erlang.svg"
  about: Erlang is a programming language used to build massively scalable soft real-time systems with requirements on high availability with built-in support for concurrency, distribution and fault tolerance.
- name: Erlog
  link: https://github.com/rvirding/erlog
  image:
  about: Erlog is a Prolog interpreter implemented in Erlang and integrated with the Erlang runtime system. It is a subset of the Prolog standard. An Erlog shell (REPL) is also included.
- name: Fika
  link: https://github.com/fika-lang/fika
  image: "/assets/images/languages/fika.svg"
  about: Fika is a modern programming language for the web. It is statically typed, functional and runs on the BEAM. Fika is designed to be a beginner-friendly, safe and productive language for building web applications with a delightful developer experience.
- name: Gleam
  link: https://gleam.run/
  image: "/assets/images/languages/gleam.svg"
  about: Gleam is a fast, friendly, and functional language for building safe, scalable systems all on top of the Erlang VM. It provides a powerful static type system to help find and prevent bugs at compile time, long before it reaches your users.
- name: Hamler
  link: https://www.hamler-lang.org/
  image: "/assets/images/languages/hamler.svg"
  about: Hamler is a strongly-typed language with compile-time typechecking and built-in support for concurrency and distribution and empowers industries to build the next generation of scalable, reliable, realtime applications
- name: LFE (Lisp Flavored Erlang)
  link: https://lfe.io/
  image: "/assets/images/languages/lfe.svg"
  about: LFE is a Lisp-2+ written for the Erlang VM, providing 100% compatibility with Core Erlang. LFE is a serious Lisp for building scalable, distributed applications—like the Erlang software that powers 40% of the world's telecommunications.
- name: Luerl
  link: https://github.com/rvirding/luerl
  image: "/assets/images/languages/luerl.svg"
  about: Luerl is an implementation of standard Lua 5.3 written in Erlang/OTP. Lua is a powerful, efficient, lightweight, embeddable scripting language common in games, IoT devices, AI bots, machine learning and scientific computing research.
- name: OTPCL
  link: https://otpcl.net/
  image: "/assets/images/languages/otpcl.svg"
  about: The Open Telecom Platform Command Language (OTPCL) is a Tcl-like scripting and configuration language designed to be easily embedded into OTP applications.
- name: Purerl
  link: https://github.com/purerl/purerl/
  image:
  about: PureScript is a small strongly typed programming language with expressive types, written in and inspired by Haskell; purerl is a PureScript backend targetting Erlang source.
- name: Rufus
  link: https://github.com/rufus-lang/rufus/
  image:
  about: Rufus is a statically typed language that aims to provide Erlang semantics, with a developer experience that supports teams working together to build and operate fault-tolerant distributed systems.
