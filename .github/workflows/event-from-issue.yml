# When a maintainer labels an event issue `approved`, add the event as
# docs/_events/<year>/<id>.md and open a pull request. Merging it publishes
# the event. Requires "Allow GitHub Actions to create and approve pull
# requests" in the repository's Actions settings.
name: Event from issue

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: event-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  add-event:
    if: github.event.label.name == 'approved' && startsWith(github.event.issue.title, '[Event:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build event file
        id: event
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 .github/scripts/event_from_issue.py

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_TITLE: ${{ steps.event.outputs.title }}
          EVENT_ID: ${{ steps.event.outputs.id }}
        run: |
          branch="event/issue-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add docs/_events docs/assets/images/events
          git commit -m "Add event: ${EVENT_TITLE}" -m "Closes #${ISSUE_NUMBER}"
          git push --force origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --head "$branch" --base "${{ github.event.repository.default_branch }}" \
              --title "Add event: ${EVENT_TITLE}" \
              --body "Adds event \`${EVENT_ID}\` from #${ISSUE_NUMBER}. Merging publishes it on https://com.erlef.org/events/.

          Closes #${ISSUE_NUMBER}"
          fi

      - name: Report problems on the issue
        if: failure() && steps.event.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file event-errors.md
          gh issue edit "$ISSUE_NUMBER" --remove-label approved
